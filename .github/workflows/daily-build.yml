---
# SPDX-License-Identifier: MPL-2.0

name: Daily Runtime Build

permissions:
  contents: write

'on':
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug build'
        required: false
        type: boolean
        default: true
      pgo:
        description: 'Enable Profile-Guided Optimization'
        required: false
        type: boolean
        default: true

run-name: Daily Runtime Build${{ inputs.debug && ' (Debug)' || '' }}

jobs:
  windows-x86_64:
    name: Windows x86_64
    uses: ./.github/workflows/wrapper-build-windows.yml
    secrets: inherit
    with:
      debug: ${{ github.event.inputs.debug == 'true' }}
      pgo: ${{ github.event.inputs.pgo == 'true' && github.event_name != 'schedule' }}

  linux-x86_64:
    name: Linux x86_64
    uses: ./.github/workflows/wrapper-build-linux.yml
    secrets: inherit
    with:
      debug: ${{ github.event.inputs.debug == 'true' }}
      pgo: ${{ github.event.inputs.pgo == 'true' && github.event_name != 'schedule' }}

  linux-aarch64:
    name: Linux aarch64
    uses: ./.github/workflows/wrapper-build-linux.yml
    secrets: inherit
    with:
      debug: ${{ github.event.inputs.debug == 'true' }}
      pgo: ${{ github.event.inputs.pgo == 'true' && github.event_name != 'schedule' }}
      arch: aarch64

  mac:
    name: Mac build
    uses: ./.github/workflows/wrapper-mac-build.yml
    secrets: inherit
    with:
      debug: ${{ github.event.inputs.debug == 'true' }}
      pgo: ${{ github.event.inputs.pgo == 'true' && github.event_name != 'schedule' }}

  publish-debug-to-core-ftp:
    name: Publish Debug Assets to Core FTP
    needs: [windows-x86_64, linux-x86_64, linux-aarch64, mac]
    if: ${{ github.event.inputs.debug == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: floorp-windows-x86_64-moz-artifact
          path: artifacts/windows

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: floorp-linux-x86_64-moz-artifact
          path: artifacts/linux-x86_64

      - name: Download Linux aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: floorp-linux-aarch64-moz-artifact
          path: artifacts/linux-aarch64

      - name: Download Mac Universal artifact
        uses: actions/download-artifact@v4
        with:
          name: floorp-mac-universal-moz-artifact
          path: artifacts/mac

      - name: Zip all artifacts for FTP upload
        run: |
          set -euo pipefail
          mkdir -p ftp-upload
          (cd artifacts/windows && zip -r ../../ftp-upload/windows-x86_64-artifacts.zip .)
          (cd artifacts/linux-x86_64 && zip -r ../../ftp-upload/linux-x86_64-artifacts.zip .)
          (cd artifacts/linux-aarch64 && zip -r ../../ftp-upload/linux-aarch64-artifacts.zip .)
          (cd artifacts/mac && zip -r ../../ftp-upload/mac-universal-artifacts.zip .)

      - name: Upload via FTP to Core Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_DEV_ASSETS_HOST }}
          username: ${{ secrets.FTP_DEV_ASSETS_USER }}
          password: ${{ secrets.FTP_DEV_ASSETS_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ftp-upload/
          server-dir: /public_html/runtime-builds/

  publish-release:
    name: Publish Release Assets
    needs: [windows-x86_64, linux-x86_64, linux-aarch64, mac]
    if: ${{ github.event.inputs.debug != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: floorp-windows-x86_64-moz-artifact
          path: artifacts/windows

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: floorp-linux-x86_64-moz-artifact
          path: artifacts/linux-x86_64

      - name: Download Linux aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: floorp-linux-aarch64-moz-artifact
          path: artifacts/linux-aarch64

      - name: Download Mac Universal artifact
        uses: actions/download-artifact@v4
        with:
          name: floorp-mac-universal-moz-artifact
          path: artifacts/mac

      - name: Download Windows dist-host artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64-dist-host
          path: artifacts/windows/dist-host

      - name: Download Windows application.ini artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64-application-ini
          path: artifacts/windows/application-ini

      - name: Download Linux x86_64 dist-host artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-dist-host
          path: artifacts/linux-x86_64/dist-host

      - name: Download Linux x86_64 application.ini artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-application-ini
          path: artifacts/linux-x86_64/application-ini

      - name: Download Linux aarch64 dist-host artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-aarch64-dist-host
          path: artifacts/linux-aarch64/dist-host

      - name: Download Linux aarch64 application.ini artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-aarch64-application-ini
          path: artifacts/linux-aarch64/application-ini

      - name: Download macOS universal dist-host artifact
        uses: actions/download-artifact@v4
        with:
          name: macOS-universal-dist-host
          path: artifacts/mac/dist-host

      - name: Download macOS universal application.ini artifact
        uses: actions/download-artifact@v4
        with:
          name: macOS-universal-application-ini
          path: artifacts/mac/application-ini

      - name: Prepare MAR helper release assets
        run: |
          set -euo pipefail

          mkdir -p release-assets

          create_zip() {
            local source_dir="$1"
            local output_name="$2"

            if [ ! -d "$source_dir" ]; then
              echo "Skipping $output_name: directory $source_dir not found"
              return
            fi

            if [ -z "$(ls -A "$source_dir")" ]; then
              echo "Skipping $output_name: directory $source_dir is empty"
              return
            fi

            (cd "$source_dir" && zip -r -q "$GITHUB_WORKSPACE/release-assets/$output_name" .)
          }

          create_zip artifacts/windows/dist-host windows-x86_64-dist-host.zip
          create_zip artifacts/windows/application-ini windows-x86_64-application-ini.zip

          create_zip artifacts/linux-x86_64/dist-host linux-x86_64-dist-host.zip
          create_zip artifacts/linux-x86_64/application-ini linux-x86_64-application-ini.zip

          create_zip artifacts/linux-aarch64/dist-host linux-aarch64-dist-host.zip
          create_zip artifacts/linux-aarch64/application-ini linux-aarch64-application-ini.zip

          create_zip artifacts/mac/dist-host macOS-universal-dist-host.zip
          create_zip artifacts/mac/application-ini macOS-universal-application-ini.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daily-${{ github.run_number }}
          name: Daily Build ${{ github.run_number }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/windows/floorp-windows-x86_64-moz-artifact.zip
            artifacts/linux-x86_64/floorp-linux-x86_64-moz-artifact.tar.xz
            artifacts/linux-aarch64/floorp-linux-aarch64-moz-artifact.tar.xz
            artifacts/mac/floorp-macOS-universal-moz-artifact.dmg
            artifacts/mac/floorp-macOS.update_framework_artifacts.zip
            release-assets/windows-x86_64-dist-host.zip
            release-assets/windows-x86_64-application-ini.zip
            release-assets/linux-x86_64-dist-host.zip
            release-assets/linux-x86_64-application-ini.zip
            release-assets/linux-aarch64-dist-host.zip
            release-assets/linux-aarch64-appliction-ini.zip
            release-assets/macOS-universal-dist-host.zip
            release-assets/macOS-universal-application-ini.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

