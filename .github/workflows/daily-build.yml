---
# SPDX-License-Identifier: MPL-2.0

name: Daily Runtime Build

permissions:
  contents: write

'on':
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug build'
        required: false
        type: boolean
        default: true
      pgo:
        description: 'Enable Profile-Guided Optimization'
        required: false
        type: boolean
        default: true

run-name: Daily Runtime Build${{ inputs.debug && ' (Debug)' || '' }}

jobs:
  windows-x86_64:
    name: Windows x86_64
    uses: ./.github/workflows/wrapper-build-windows.yml
    secrets: inherit
    with:
      debug: ${{ github.event.inputs.debug == 'true' || github.event_name == 'schedule' }}
      pgo: ${{ github.event.inputs.pgo == 'true' && github.event_name != 'schedule' }}

  linux-x86_64:
    name: Linux x86_64
    uses: ./.github/workflows/wrapper-build-linux.yml
    secrets: inherit
    with:
      debug: ${{ github.event.inputs.debug == 'true' || github.event_name == 'schedule' }}
      pgo: ${{ github.event.inputs.pgo == 'true' && github.event_name != 'schedule' }}

  linux-aarch64:
    name: Linux aarch64
    uses: ./.github/workflows/wrapper-build-linux.yml
    secrets: inherit
    with:
      debug: ${{ github.event.inputs.debug == 'true' || github.event_name == 'schedule' }}
      pgo: ${{ github.event.inputs.pgo == 'true' && github.event_name != 'schedule' }}
      arch: aarch64

  mac:
    name: Mac build
    uses: ./.github/workflows/wrapper-mac-build.yml
    secrets: inherit
    with:
      debug: ${{ github.event.inputs.debug == 'true' || github.event_name == 'schedule' }}
      pgo: ${{ github.event.inputs.pgo == 'true' && github.event_name != 'schedule' }}

  publish-release:
    name: Publish Release Assets
    needs: [windows-x86_64, linux-x86_64, linux-aarch64, mac]
    if: ${{ github.event.inputs.debug != 'true' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: floorp-windows-x86_64-moz-artifact
          path: artifacts/windows

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: floorp-linux-x86_64-moz-artifact
          path: artifacts/linux-x86_64

      - name: Download Linux aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: floorp-linux-aarch64-moz-artifact
          path: artifacts/linux-aarch64

      - name: Download Mac Universal artifact
        uses: actions/download-artifact@v4
        with:
          name: floorp-mac-universal-moz-artifact
          path: artifacts/mac

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: daily-${{ github.run_number }}
          name: Daily Build ${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            artifacts/windows/floorp-windows-x86_64-moz-artifact.zip
            artifacts/linux-x86_64/floorp-linux-x86_64-moz-artifact.tar.xz
            artifacts/linux-aarch64/floorp-linux-aarch64-moz-artifact.tar.xz
            artifacts/mac/floorp-macOS-universal-moz-artifact.dmg
            artifacts/mac/floorp-macOS.update_framework_artifacts.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

