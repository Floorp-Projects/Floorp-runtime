on:
  workflow_call:
    inputs:
      MOZ_BUILD_DATE:
        description: "Resolved 14-digit build ID"
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  macOS-Universal-gen-profdata-and-jarlog:
    runs-on: ${{ matrix.runs-on }}
    env:
      ARCH_TYPE: ${{ matrix.arch }}
      MOZ_BUILD_DATE: ${{ inputs.MOZ_BUILD_DATE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15-intel
            arch: x86_64
            runner-arch: x86_64
          - runs-on: macos-14
            arch: aarch64
            runner-arch: arm64

    steps:
      - name: Init
        run: |
          sysctl machdep.cpu
          export RUNNER_USERDIR=`echo ~`
          echo "RUNNER_USERDIR=$RUNNER_USERDIR" >> $GITHUB_ENV
          mkdir -p ~/downloads/artifacts

      - uses: actions/checkout@v4
        name: Clone 🧬
        with:
          submodules: 'true'

      - uses: actions/download-artifact@v4
        id: download-artifacts-mac-enable-profgen
        name: Download artifact 📥
        with:
          name: floorp-mac-${{ env.ARCH_TYPE }}-build-with-profgen
          path: ~/downloads/artifacts

      - name: Download macOS SDK
        uses: actions/download-artifact@v4
        with:
          name: macos-sdk
          path: ~/macos-sdk-artifact

      - name: Extract macOS SDK
        run: |
          mkdir -p ~/macos-sdk
          gtar -xzf ~/macos-sdk-artifact/macos_sdk.tar.gz -C ~/macos-sdk --warning=no-unknown-keyword || tar -xzf ~/macos-sdk-artifact/macos_sdk.tar.gz -C ~/macos-sdk

      - name: force install python3.12
        continue-on-error: true
        run: |
          brew install python@3.12

      - name: force link python3.12
        continue-on-error: true
        run: |
          # due to "Error: The `brew link` step did not complete successfully" we need to force link python3.12
          brew link --force --overwrite python@3.12

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set LLVM environment variables
        run: |
          echo "LLVM_VERSION=19" >> $GITHUB_ENV
          if [[ $ARCH_TYPE == 'x86_64' ]];then
              echo "TARGET_TRIPLE=x86_64-apple-darwin" >> $GITHUB_ENV
          else
              echo "TARGET_TRIPLE=aarch64-apple-darwin" >> $GITHUB_ENV
          fi
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV

      - name: Install LLVM 19 toolchain
        run: |
          # Install LLVM 19 via Homebrew
          brew install llvm@19

          # Add LLVM to PATH
          echo "/opt/homebrew/opt/llvm@19/bin" >> $GITHUB_PATH
          echo "/usr/local/opt/llvm@19/bin" >> $GITHUB_PATH

          # Verify versions
          echo "Checking installed versions:"
          export PATH="/opt/homebrew/opt/llvm@19/bin:/usr/local/opt/llvm@19/bin:$PATH"
          clang --version || echo "clang not found"
          llvm-profdata --version || echo "llvm-profdata not found"

      - name: setup environment 🌲
        env:
          GHA_BUILD_MACHINE: ${{ matrix.runs-on }}
          SDKROOT: ${{ env.RUNNER_USERDIR }}/macos-sdk
          MACOS_SDK_DIR: ${{ env.RUNNER_USERDIR }}/macos-sdk
          MOZ_SDK_DIR: ${{ env.RUNNER_USERDIR }}/macos-sdk
        run: |
          echo "ac_add_options --disable-bootstrap" >> mozconfig

          # Add macOS SDK path
          echo "ac_add_options --with-macos-sdk=$(echo ~)/macos-sdk" >> mozconfig

          # Add linker configuration to match build
          echo "ac_add_options --enable-linker=lld" >> mozconfig

          echo 'mozconfig: **********************'
          cat ./mozconfig
          echo '*********************************'

          brew install gnu-tar
          export PATH=/usr/local/opt/gnu-tar/libexec/gnubin:$PATH
          ./mach --no-interactive bootstrap --application-choice browser

          # Override mozconfig
          echo -e "ac_add_options --enable-bootstrap" > mozconfig
          echo "ac_add_options --with-macos-sdk=$(echo ~)/macos-sdk" >> mozconfig
          echo "ac_add_options --enable-linker=lld" >> mozconfig

      - name: Install setup tool via PIP 📦
        run: |
          pip install setuptools

      - name: Extract artifact 📂
        run: |
          set -euo pipefail
          cd ~/downloads/artifacts
          echo "Contents of download path:"
          ls -la
          echo "Extracting floorp-mac-${ARCH_TYPE}-moz-artifact.tar.gz..."
          tar xzf floorp-mac-${ARCH_TYPE}-moz-artifact.tar.gz -C ${{ github.workspace }}
          echo "Extraction complete. Checking workspace:"
          ls -la ${{ github.workspace }}/obj-${ARCH_TYPE}-apple-darwin/ || echo "Directory not found"

      - name: Verify Stage 1 runtime build identity
        shell: bash
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner-arch }}
        run: |
          set -euo pipefail

          if [[ ! "$MOZ_BUILD_DATE" =~ ^[0-9]{14}$ ]]; then
            echo "Expected build ID must be exactly 14 digits: $MOZ_BUILD_DATE" >&2
            exit 1
          fi

          RUNNER_ARCH=$(uname -m)
          if [[ "$RUNNER_ARCH" != "$EXPECTED_RUNNER_ARCH" ]]; then
            echo "Runner architecture $RUNNER_ARCH does not match $EXPECTED_RUNNER_ARCH for $ARCH_TYPE" >&2
            exit 1
          fi

          APP_BINARY=$(find \
            "./obj-${ARCH_TYPE}-apple-darwin/dist/floorp" \
            -type f -path "*.app/Contents/MacOS/floorp" -print | sed -n '1p')
          if [[ -z "$APP_BINARY" || ! -x "$APP_BINARY" ]]; then
            echo "Unable to locate an executable Stage 1 Floorp app for $ARCH_TYPE" >&2
            exit 1
          fi

          unset XUL_APP_FILE
          echo "Running native identity check: $APP_BINARY --full-version"
          FULL_VERSION_OUTPUT=$("$APP_BINARY" --full-version 2>&1)
          printf '%s\n' "$FULL_VERSION_OUTPUT"

          BUILD_IDS=$(printf '%s\n' "$FULL_VERSION_OUTPUT" | grep -Eo '[0-9]{14}' || true)
          BUILD_ID_COUNT=$(printf '%s\n' "$BUILD_IDS" | sed '/^$/d' | wc -l | tr -d ' ')
          FIRST_BUILD_ID=$(printf '%s\n' "$BUILD_IDS" | sed -n '1p')
          SECOND_BUILD_ID=$(printf '%s\n' "$BUILD_IDS" | sed -n '2p')

          if [[ "$BUILD_ID_COUNT" != "2" ]]; then
            echo "Expected exactly two 14-digit IDs from --full-version, found $BUILD_ID_COUNT" >&2
            exit 1
          fi
          if [[ "$FIRST_BUILD_ID" != "$MOZ_BUILD_DATE" || "$SECOND_BUILD_ID" != "$MOZ_BUILD_DATE" ]]; then
            echo "Stage 1 IDs do not both match expected build ID $MOZ_BUILD_DATE" >&2
            exit 1
          fi
          if ! printf '%s\n' "$FULL_VERSION_OUTPUT" | grep -Eq "(^|[^0-9])${MOZ_BUILD_DATE}[[:space:]]+${MOZ_BUILD_DATE}([^0-9]|$)"; then
            echo "The two expected build IDs are not adjacent in --full-version output" >&2
            exit 1
          fi

          echo "STAGE1_APP_BINARY=$APP_BINARY" >> "$GITHUB_ENV"

## ./mach python python/mozbuild/mozbuild/action/install.py $MOZ_FETCHES_DIR/target.dmg $MOZ_FETCHES_DIR
      - name: Generate Profdata 📊
        env:
          SDKROOT: ${{ env.RUNNER_USERDIR }}/macos-sdk
          MACOS_SDK_DIR: ${{ env.RUNNER_USERDIR }}/macos-sdk
          MOZ_SDK_DIR: ${{ env.RUNNER_USERDIR }}/macos-sdk
          GHA_BUILD_MACHINE: ${{ matrix.runs-on }}
        run: |
          # Use LLVM 19's llvm-profdata
          if [[ -f /opt/homebrew/opt/llvm@19/bin/llvm-profdata ]]; then
            export LLVM_PROFDATA=/opt/homebrew/opt/llvm@19/bin/llvm-profdata
          elif [[ -f /usr/local/opt/llvm@19/bin/llvm-profdata ]]; then
            export LLVM_PROFDATA=/usr/local/opt/llvm@19/bin/llvm-profdata
          else
            export LLVM_PROFDATA=$RUNNER_USERDIR/.mozbuild/clang/bin/llvm-profdata
          fi
          
          echo "Using LLVM_PROFDATA: $LLVM_PROFDATA"
          $LLVM_PROFDATA --version || echo "llvm-profdata version check failed"
          
          export JARLOG_FILE="en-US.log"
          ./mach python build/pgo/profileserver.py --binary "$STAGE1_APP_BINARY"

      - name: Publish 🎁
        uses: actions/upload-artifact@v4
        with:
          name: floorp-${{ env.ARCH_TYPE }}-apple-darwin-profdata-and-jarlog
          path: |
            merged.profdata
            en-US.log
          if-no-files-found: error
          overwrite: true
